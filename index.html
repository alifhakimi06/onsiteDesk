<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnsiteDesk - Staff Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-200">
    <!-- Header -->
    <div class="text-center mb-6">
      <p class="text-xs font-semibold tracking-wider text-emerald-700 uppercase">Service Desk Portal</p>
      <h1 id="formTitle" class="text-2xl font-bold text-gray-900 mt-1">Sign in to your account</h1>
      <p id="formSubtitle" class="text-sm text-gray-500 mt-1">Enter your details to submit a service request</p>
    </div>

    <!-- Toggle Sign In / Sign Up -->
    <div class="flex bg-gray-100 rounded-lg p-1 mb-6">
      <button type="button" onclick="toggleAuthMode('signin')" id="tabSignIn"
        class="w-1/2 py-2 text-sm font-semibold rounded-md bg-white text-gray-900 shadow-sm transition">
        Sign In
      </button>
      <button type="button" onclick="toggleAuthMode('signup')" id="tabSignUp"
        class="w-1/2 py-2 text-sm font-semibold rounded-md text-gray-500 hover:text-gray-900 transition">
        Sign Up
      </button>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

    <!-- ================= SIGN IN FORM ================= -->
    <form id="signInForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp Number</label>
        <input type="tel" id="loginPhone" required placeholder="60123456789"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <button type="submit" id="signInBtn"
        class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
        Sign In
      </button>
    </form>

    <!-- ================= SIGN UP FORM ================= -->
    <form id="signUpForm" class="hidden space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
        <input type="text" id="regName" required placeholder="Enter your full name"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Your WhatsApp Number</label>
        <input type="tel" id="regPhone" required placeholder="60123456789"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
        <span class="text-[11px] text-gray-400">Used as your login ID & for WhatsApp updates</span>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Create Password</label>
        <input type="password" id="regPassword" required placeholder="••••••••"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>
      <button type="submit" id="signUpBtn"
        class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
        Create Account
      </button>
    </form>
  </div>

  <script>
    // Auto-detect Firebase URL for project: onsitedesk-3833b-default-rtdb
    const DB_URLS = [
      "https://onsitedesk-3833b-default-rtdb.asia-southeast1.firebasedatabase.app",
      "https://onsitedesk-3833b-default-rtdb.firebaseio.com"
    ];
    let activeDbUrl = localStorage.getItem("firebaseActiveUrl") || DB_URLS[0];

    // If already signed in, go straight to user.html
    window.onload = () => {
      if (localStorage.getItem("staffSession")) {
        window.location.href = "user.html";
      }
    };

    async function dbFetch(path, options = {}) {
      for (const baseUrl of [activeDbUrl, ...DB_URLS]) {
        try {
          const res = await fetch(`${baseUrl}${path}`, options);
          if (res.ok) {
            activeDbUrl = baseUrl;
            localStorage.setItem("firebaseActiveUrl", baseUrl);
            return await res.json();
          }
        } catch (e) {}
      }
      throw new Error("Cannot connect to Firebase. Ensure Realtime Database Rules are set to Test Mode.");
    }

    function formatPhone(phone) {
      let cleaned = phone.replace(/\D/g, '');
      if (cleaned.startsWith('0')) cleaned = '6' + cleaned;
      else if (!cleaned.startsWith('60')) cleaned = '60' + cleaned;
      return cleaned;
    }

    function showAlert(message, isError = true) {
      const box = document.getElementById("alertBox");
      box.className = `mb-4 p-3 rounded-lg text-xs font-medium border ${
        isError ? "bg-red-50 text-red-700 border-red-200" : "bg-emerald-50 text-emerald-800 border-emerald-200"
      }`;
      box.innerText = message;
      box.classList.remove("hidden");
    }

    function toggleAuthMode(mode) {
      const isSignIn = (mode === 'signin');
      document.getElementById("signInForm").classList.toggle("hidden", !isSignIn);
      document.getElementById("signUpForm").classList.toggle("hidden", isSignIn);
      document.getElementById("alertBox").classList.add("hidden");

      document.getElementById("formTitle").innerText = isSignIn ? "Sign in to your account" : "Create a staff account";
      document.getElementById("formSubtitle").innerText = isSignIn ? "Enter your details to submit a service request" : "Register your name and WhatsApp number";

      document.getElementById("tabSignIn").className = isSignIn
        ? "w-1/2 py-2 text-sm font-semibold rounded-md bg-white text-gray-900 shadow-sm transition"
        : "w-1/2 py-2 text-sm font-semibold rounded-md text-gray-500 hover:text-gray-900 transition";
      document.getElementById("tabSignUp").className = !isSignIn
        ? "w-1/2 py-2 text-sm font-semibold rounded-md bg-white text-gray-900 shadow-sm transition"
        : "w-1/2 py-2 text-sm font-semibold rounded-md text-gray-500 hover:text-gray-900 transition";
    }

    // Handle Sign Up
    document.getElementById("signUpForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("signUpBtn");
      btn.innerText = "Creating account...";
      btn.disabled = true;

      const name = document.getElementById("regName").value.trim();
      const phone = formatPhone(document.getElementById("regPhone").value.trim());
      const password = document.getElementById("regPassword").value;

      try {
        const existingUser = await dbFetch(`/staffUsers/${phone}.json`);
        if (existingUser) {
          showAlert("This WhatsApp number is already registered. Please Sign In.", true);
          btn.innerText = "Create Account";
          btn.disabled = false;
          return;
        }

        const newUser = { name, phone, password, createdAt: new Date().toISOString() };
        await dbFetch(`/staffUsers/${phone}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newUser)
        });

        localStorage.setItem("staffSession", JSON.stringify(newUser));
        window.location.href = "user.html";
      } catch (err) {
        showAlert(err.message, true);
        btn.innerText = "Create Account";
        btn.disabled = false;
      }
    });

    // Handle Sign In
    document.getElementById("signInForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("signInBtn");
      btn.innerText = "Signing in...";
      btn.disabled = true;

      const phone = formatPhone(document.getElementById("loginPhone").value.trim());
      const password = document.getElementById("loginPassword").value;

      try {
        const foundUser = await dbFetch(`/staffUsers/${phone}.json`);
        if (!foundUser || foundUser.password !== password) {
          showAlert("Invalid WhatsApp number or password.", true);
          btn.innerText = "Sign In";
          btn.disabled = false;
          return;
        }

        localStorage.setItem("staffSession", JSON.stringify(foundUser));
        window.location.href = "user.html";
      } catch (err) {
        showAlert(err.message, true);
        btn.innerText = "Sign In";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
