<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Desk - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-200">
    <!-- Header -->
    <div class="text-center mb-6">
      <p class="text-xs font-semibold tracking-wider text-emerald-700 uppercase">Service Desk Portal</p>
      <h1 id="formTitle" class="text-2xl font-bold text-gray-900 mt-1">Sign in to your account</h1>
      <p id="formSubtitle" class="text-sm text-gray-500 mt-1">Enter your details to access the portal</p>
    </div>

    <!-- Toggle Sign In / Sign Up Tabs -->
    <div class="flex bg-gray-100 rounded-lg p-1 mb-6">
      <button type="button" onclick="toggleAuthMode('signin')" id="tabSignIn"
        class="w-1/2 py-2 text-sm font-semibold rounded-md bg-white text-gray-900 shadow-sm transition">
        Sign In
      </button>
      <button type="button" onclick="toggleAuthMode('signup')" id="tabSignUp"
        class="w-1/2 py-2 text-sm font-semibold rounded-md text-gray-500 hover:text-gray-900 transition">
        Sign Up
      </button>
    </div>

    <!-- Alert Box for Errors/Success -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

    <!-- ================= SIGN IN FORM ================= -->
    <form id="signInForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp Number</label>
        <input type="tel" id="loginPhone" required placeholder="60123456789"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>

      <button type="submit"
        class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
        Sign In
      </button>
    </form>

    <!-- ================= SIGN UP FORM ================= -->
    <form id="signUpForm" class="hidden space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input type="text" id="regName" required placeholder="Enter your name"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp Number</label>
        <input type="tel" id="regPhone" required placeholder="60123456789"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
        <span class="text-[11px] text-gray-400">Used as your login ID & for WhatsApp updates</span>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Select Role</label>
        <select id="regRole"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          <option value="user">Regular User (Submit Requests)</option>
          <option value="staff">Onsite Staff (Handle Tasks)</option>
          <option value="qm">Queue Manager (QM)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Create Password</label>
        <input type="password" id="regPassword" required placeholder="••••••••"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none">
      </div>

      <button type="submit"
        class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
        Create Account
      </button>
    </form>
  </div>

  <script>
    // Format phone number to start with 60
    function formatPhone(phone) {
      let cleaned = phone.replace(/\D/g, '');
      if (cleaned.startsWith('0')) cleaned = '6' + cleaned;
      return cleaned;
    }

    function showAlert(message, isError = true) {
      const box = document.getElementById("alertBox");
      box.classList.remove("hidden", "bg-red-50", "text-red-700", "border-red-200", "bg-emerald-50", "text-emerald-800", "border-emerald-200");
      box.classList.add("border", isError ? "bg-red-50" : "bg-emerald-50", isError ? "text-red-700" : "text-emerald-800", isError ? "border-red-200" : "border-emerald-200");
      box.innerText = message;
    }

    // Switch between Sign In and Sign Up
    function toggleAuthMode(mode) {
      const isSignIn = (mode === 'signin');
      document.getElementById("signInForm").classList.toggle("hidden", !isSignIn);
      document.getElementById("signUpForm").classList.toggle("hidden", isSignIn);
      document.getElementById("alertBox").classList.add("hidden");

      document.getElementById("formTitle").innerText = isSignIn ? "Sign in to your account" : "Create a new account";
      document.getElementById("formSubtitle").innerText = isSignIn ? "Enter your details to access the portal" : "Register your details and role";

      document.getElementById("tabSignIn").className = isSignIn
        ? "w-1/2 py-2 text-sm font-semibold rounded-md bg-white text-gray-900 shadow-sm transition"
        : "w-1/2 py-2 text-sm font-semibold rounded-md text-gray-500 hover:text-gray-900 transition";
      document.getElementById("tabSignUp").className = !isSignIn
        ? "w-1/2 py-2 text-sm font-semibold rounded-md bg-white text-gray-900 shadow-sm transition"
        : "w-1/2 py-2 text-sm font-semibold rounded-md text-gray-500 hover:text-gray-900 transition";
    }

    // Redirect user based on their role
    function redirectByRole(user) {
      if (user.role === "user") {
        window.location.href = "user.html";
      } else {
        // Since Staff & QM pages are set aside for now, show message or redirect to user.html temporarily
        alert(`Signed in as ${user.role.toUpperCase()} (${user.name}).\n(Staff/QM page will be added next! Redirecting to User Page for now.)`);
        window.location.href = "user.html";
      }
    }

    // Handle Sign Up
    document.getElementById("signUpForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("regName").value.trim();
      const phone = formatPhone(document.getElementById("regPhone").value.trim());
      const role = document.getElementById("regRole").value;
      const password = document.getElementById("regPassword").value;

      const users = JSON.parse(localStorage.getItem("registeredUsers") || "[]");

      // Check if phone number is already registered
      if (users.some(u => u.phone === phone)) {
        showAlert("This WhatsApp number is already registered. Please Sign In.", true);
        return;
      }

      const newUser = { name, phone, role, password };
      users.push(newUser);
      localStorage.setItem("registeredUsers", JSON.stringify(users));

      // Auto Sign-In after registration
      localStorage.setItem("currentUser", JSON.stringify(newUser));
      redirectByRole(newUser);
    });

    // Handle Sign In
    document.getElementById("signInForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const phone = formatPhone(document.getElementById("loginPhone").value.trim());
      const password = document.getElementById("loginPassword").value;

      const users = JSON.parse(localStorage.getItem("registeredUsers") || "[]");
      const foundUser = users.find(u => u.phone === phone && u.password === password);

      if (!foundUser) {
        showAlert("Invalid WhatsApp number or password. Please try again or Sign Up.", true);
        return;
      }

      // Save active session & redirect
      localStorage.setItem("currentUser", JSON.stringify(foundUser));
      redirectByRole(foundUser);
    });
  </script>
</body>
</html>
