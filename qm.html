<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnsiteDesk - Ticket Queue (QM & Staff)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col md:flex-row">

  <!-- ================= LEFT SIDEBAR ================= -->
  <aside class="w-full md:w-64 bg-white border-r border-gray-200 flex flex-col justify-between p-5 shrink-0">
    <div>
      <p class="text-[11px] font-bold tracking-widest text-gray-400 uppercase">Service Desk</p>
      <h1 class="text-xl font-bold text-gray-900 mt-0.5 mb-6">Ticket queue</h1>

      <nav class="space-y-1.5 text-sm">
        <a href="qm.html" class="flex items-center justify-between px-3 py-2.5 rounded-lg bg-emerald-50 text-emerald-900 font-semibold">
          <span>📥 Queue</span>
          <span id="sidebarActiveCount" class="text-xs bg-emerald-700 text-white px-2 py-0.5 rounded-full">0</span>
        </a>
        <a href="user.html" class="flex items-center px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition">
          <span>📝 Request form</span>
        </a>
        <button onclick="exportCSV()" class="w-full text-left flex items-center px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition">
          <span>📊 Export Report (CSV)</span>
        </button>
      </nav>
    </div>

    <!-- Logged-in Staff / QM Profile -->
    <div class="pt-4 mt-6 border-t border-gray-100">
      <p class="text-sm font-bold text-gray-900" id="qmName">Loading...</p>
      <p class="text-[11px] font-semibold tracking-wider text-emerald-700 uppercase mt-0.5" id="qmRole">QUEUE MANAGER</p>
      <button onclick="signOut()" class="mt-3 flex items-center text-xs font-medium text-red-600 hover:underline">
        ↪ Sign out
      </button>
    </div>
  </aside>

  <!-- ================= MAIN CONTENT AREA ================= -->
  <main class="flex-1 p-5 md:p-8 overflow-y-auto">
    
    <!-- Top Bar + Date Range Filter -->
    <div class="flex flex-wrap justify-between items-center gap-3 mb-5">
      <div>
        <h2 class="text-2xl font-bold text-gray-900">Ticket queue</h2>
        <p class="text-xs text-gray-500">Connected to Firebase (onsitedesk-3833b) • Auto-syncs every 4s</p>
      </div>

      <!-- Time Filter Pills (Like your screenshot) -->
      <div class="flex flex-wrap bg-white border border-gray-200 rounded-full p-1 text-xs font-medium gap-1">
        <button onclick="setTimeFilter('all')" id="time-all" class="time-pill px-3 py-1 rounded-full bg-emerald-800 text-white">All time</button>
        <button onclick="setTimeFilter('today')" id="time-today" class="time-pill px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100">Today</button>
        <button onclick="setTimeFilter('week')" id="time-week" class="time-pill px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100">This week</button>
        <button onclick="setTimeFilter('month')" id="time-month" class="time-pill px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100">This month</button>
      </div>
    </div>

    <!-- 4 KPI Summary Cards (Clickable to filter directly) -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div onclick="setStatusFilter('New')" class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm cursor-pointer hover:border-blue-400 transition">
        <p class="text-xs font-semibold text-gray-400 uppercase">NEW</p>
        <p class="text-3xl font-bold text-blue-600 mt-1" id="statNew">0</p>
      </div>
      <div onclick="setStatusFilter('In progress')" class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm cursor-pointer hover:border-amber-400 transition">
        <p class="text-xs font-semibold text-gray-400 uppercase">IN PROGRESS</p>
        <p class="text-3xl font-bold text-gray-900 mt-1" id="statProgress">0</p>
      </div>
      <div onclick="setUrgentFilter()" class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm cursor-pointer hover:border-red-400 transition">
        <p class="text-xs font-semibold text-gray-400 uppercase">URGENT</p>
        <p class="text-3xl font-bold text-red-600 mt-1" id="statUrgent">0</p>
      </div>
      <div onclick="setStatusFilter('Resolved')" class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm cursor-pointer hover:border-emerald-400 transition">
        <p class="text-xs font-semibold text-gray-400 uppercase">RESOLVED</p>
        <p class="text-3xl font-bold text-emerald-700 mt-1" id="statResolved">0</p>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="mb-4">
      <input type="text" id="searchInput" oninput="renderTickets()" placeholder="Search name, number, ticket no or text..."
        class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none shadow-sm">
    </div>

    <!-- Status Filter Pills -->
    <div class="flex flex-wrap gap-1.5 mb-3 text-xs font-medium" id="statusPills">
      <button onclick="setStatusFilter('All')" data-status="All" class="status-pill px-3 py-1.5 rounded-full border bg-emerald-800 text-white">All</button>
      <button onclick="setStatusFilter('New')" data-status="New" class="status-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50">New</button>
      <button onclick="setStatusFilter('In progress')" data-status="In progress" class="status-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50">In progress</button>
      <button onclick="setStatusFilter('Waiting')" data-status="Waiting" class="status-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50">Waiting</button>
      <button onclick="setStatusFilter('Resolved')" data-status="Resolved" class="status-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50">Resolved</button>
      <button onclick="setStatusFilter('Assigned to me')" data-status="Assigned to me" class="status-pill px-3 py-1.5 rounded-full border bg-white text-emerald-800 border-emerald-300 hover:bg-emerald-50">👤 Assigned to me</button>
    </div>

    <!-- Category Type Filter Pills -->
    <div class="flex flex-wrap gap-1.5 mb-6 text-xs font-medium" id="typePills">
      <button onclick="setTypeFilter('All types')" data-type="All types" class="type-pill px-3 py-1.5 rounded-full border bg-gray-800 text-white">All types</button>
      <button onclick="setTypeFilter('Onsite request')" data-type="Onsite request" class="type-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50">Onsite request</button>
      <button onclick="setTypeFilter('Stock receive')" data-type="Stock receive" class="type-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50">Stock receive</button>
      <button onclick="setTypeFilter('Stock out')" data-type="Stock out" class="type-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50">Stock out</button>
      <button onclick="setTypeFilter('Shop assistance')" data-type="Shop assistance" class="type-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50">Shop assistance</button>
      <button onclick="setTypeFilter('Event assistance')" data-type="Event assistance" class="type-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50">Event assistance</button>
      <button onclick="setTypeFilter('Others')" data-type="Others" class="type-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50">Others</button>
    </div>

    <!-- Ticket Cards List -->
    <div id="ticketsContainer" class="space-y-3">
      <p class="text-sm text-gray-400 text-center py-10">Syncing tickets from Firebase...</p>
    </div>

  </main>

  <script>
    const DB_URLS = [
      "https://onsitedesk-3833b-default-rtdb.asia-southeast1.firebasedatabase.app",
      "https://onsitedesk-3833b-default-rtdb.firebaseio.com"
    ];
    let activeDbUrl = localStorage.getItem("firebaseActiveUrl") || DB_URLS[0];

    async function dbFetch(path, options = {}) {
      for (const baseUrl of [activeDbUrl, ...DB_URLS]) {
        try {
          const res = await fetch(`${baseUrl}${path}`, options);
          if (res.ok) {
            activeDbUrl = baseUrl;
            localStorage.setItem("firebaseActiveUrl", baseUrl);
            return await res.json();
          }
        } catch (e) {}
      }
      throw new Error("Unable to reach Firebase database.");
    }

    let currentUser = null;
    let allTickets = [];
    let staffList = [];

    let activeStatusFilter = "All";
    let activeTypeFilter = "All types";
    let activeTimeFilter = "all";
    let onlyUrgent = false;

    window.onload = async () => {
      const saved = localStorage.getItem("currentUser");
      if (!saved) {
        window.location.href = "index.html";
        return;
      }
      currentUser = JSON.parse(saved);

      // Protect QM/Staff page from regular users
      if (currentUser.role === "user") {
        window.location.href = "user.html";
        return;
      }

      document.getElementById("qmName").innerText = currentUser.name;
      document.getElementById("qmRole").innerText = currentUser.role === "qm" ? "SYSTEM ADMIN • QUEUE MANAGER" : "ONSITE STAFF";

      await fetchUsersAndTickets();
      setInterval(fetchUsersAndTickets, 4000);
    };

    async function fetchUsersAndTickets() {
      try {
        const [ticketsData, usersData] = await Promise.all([
          dbFetch(`/tickets.json`),
          dbFetch(`/users.json`)
        ]);

        allTickets = ticketsData ? Object.values(ticketsData).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)) : [];
        staffList = usersData ? Object.values(usersData).filter(u => u.role === "staff" || u.role === "qm") : [];

        updateMetrics();
        renderTickets();
      } catch (err) {
        console.error("Sync error:", err);
      }
    }

    function filterByTime(list) {
      const now = new Date();
      if (activeTimeFilter === "today") {
        return list.filter(t => t.timestamp && new Date(t.timestamp).toDateString() === now.toDateString());
      } else if (activeTimeFilter === "week") {
        const weekAgo = now.getTime() - (7 * 24 * 60 * 60 * 1000);
        return list.filter(t => t.timestamp && t.timestamp >= weekAgo);
      } else if (activeTimeFilter === "month") {
        return list.filter(t => {
          if (!t.timestamp) return false;
          const d = new Date(t.timestamp);
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        });
      }
      return list;
    }

    function updateMetrics() {
      const filtered = filterByTime(allTickets);
      const newCount = filtered.filter(t => t.status === "New").length;
      const progCount = filtered.filter(t => t.status === "In progress" || t.status === "Waiting").length;
      const urgentCount = filtered.filter(t => (t.urgency === "Urgent" || t.urgency === "High") && t.status !== "Resolved").length;
      const resCount = filtered.filter(t => t.status === "Resolved").length;

      document.getElementById("statNew").innerText = newCount;
      document.getElementById("statProgress").innerText = progCount;
      document.getElementById("statUrgent").innerText = urgentCount;
      document.getElementById("statResolved").innerText = resCount;
      document.getElementById("sidebarActiveCount").innerText = newCount + progCount;
    }

    function renderTickets() {
      const container = document.getElementById("ticketsContainer");
      const query = document.getElementById("searchInput").value.toLowerCase().trim();

      let list = filterByTime(allTickets);

      if (onlyUrgent) {
        list = list.filter(t => (t.urgency === "Urgent" || t.urgency === "High") && t.status !== "Resolved");
      } else if (activeStatusFilter === "Assigned to me") {
        list = list.filter(t => t.assignedTo && t.assignedTo.toLowerCase() === currentUser.name.toLowerCase());
      } else if (activeStatusFilter !== "All") {
        list = list.filter(t => t.status === activeStatusFilter);
      }

      if (activeTypeFilter !== "All types") {
        list = list.filter(t => t.type === activeTypeFilter);
      }

      if (query) {
        list = list.filter(t =>
          (t.id && t.id.toLowerCase().includes(query)) ||
          (t.name && t.name.toLowerCase().includes(query)) ||
          (t.phone && t.phone.includes(query)) ||
          (t.details && t.details.toLowerCase().includes(query)) ||
          (t.assignedTo && t.assignedTo.toLowerCase().includes(query))
        );
      }

      if (list.length === 0) {
        container.innerHTML = `<div class="bg-white p-8 rounded-xl border text-center text-sm text-gray-400">No tickets found.</div>`;
        return;
      }

      container.innerHTML = list.map(t => {
        const urgBadge = t.urgency === "Urgent" ? "bg-red-100 text-red-700 border-red-200"
                       : t.urgency === "High" ? "bg-orange-100 text-orange-800 border-orange-200"
                       : t.urgency === "Low" ? "bg-gray-100 text-gray-600 border-gray-200"
                       : "bg-emerald-50 text-emerald-800 border-emerald-200";

        const statBadge = t.status === "New" ? "bg-blue-100 text-blue-800"
                        : t.status === "In progress" ? "bg-amber-100 text-amber-800"
                        : t.status === "Waiting" ? "bg-purple-100 text-purple-800"
                        : "bg-emerald-100 text-emerald-800";

        const staffOptions = [`<option value="UNASSIGNED">UNASSIGNED</option>`]
          .concat(staffList.map(s => `<option value="${s.name}" ${t.assignedTo === s.name ? "selected" : ""}>${s.name}</option>`))
          .join("");

        return `
          <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:border-gray-300 transition">
            <!-- Header Row -->
            <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
              <div class="flex items-center gap-2 text-xs text-gray-500">
                <span class="font-bold text-gray-800">#${t.id}</span>
                <span>•</span>
                <span class="font-semibold text-emerald-800">${t.type}</span>
                ${t.subCategory ? `<span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded font-medium">${t.subCategory}</span>` : ""}
              </div>

              <div class="flex items-center gap-2">
                <!-- Inline Urgency Selector for QM/Staff -->
                <select onchange="updateTicketField('${t.id}', 'urgency', this.value)"
                  class="text-xs font-semibold px-2.5 py-1 rounded-md border ${urgBadge} cursor-pointer focus:outline-none">
                  <option value="Low" ${t.urgency === "Low" ? "selected" : ""}>Low</option>
                  <option value="Normal" ${t.urgency === "Normal" ? "selected" : ""}>Normal</option>
                  <option value="High" ${t.urgency === "High" ? "selected" : ""}>High</option>
                  <option value="Urgent" ${t.urgency === "Urgent" ? "selected" : ""}>Urgent</option>
                </select>
                <span class="text-xs font-semibold px-2.5 py-1 rounded-md ${statBadge}">${t.status}</span>
              </div>
            </div>

            <!-- Requester & Description -->
            <div class="mb-3">
              <div class="flex items-center gap-2">
                <h3 class="text-base font-bold text-gray-900">${t.name}</h3>
                <a href="https://wa.me/${t.phone}" target="_blank" class="text-xs text-emerald-700 hover:underline font-medium">
                  💬 +${t.phone}
                </a>
              </div>
              <p class="text-sm text-gray-700 mt-1">${t.details}</p>
            </div>

            <!-- Footer Row: Staff Assignment & 1-Click Actions -->
            <div class="pt-3 border-t border-gray-100 flex flex-wrap justify-between items-center gap-3 text-xs">
              <div class="flex flex-wrap items-center gap-2 text-gray-500">
                <span class="font-semibold text-gray-600">Assigned:</span>
                <select onchange="assignStaff('${t.id}', this.value)"
                  class="border border-gray-300 rounded px-2 py-1 bg-gray-50 font-semibold text-gray-800 focus:outline-none">
                  ${staffOptions}
                </select>
                <span>• ${t.createdAt}</span>
                ${t.resolvedAt && t.resolvedAt !== "-" ? `<span class="text-emerald-700 font-medium">• ✅ Resolved: ${t.resolvedAt}</span>` : ""}
              </div>

              <!-- Action Buttons -->
              <div class="flex flex-wrap items-center gap-1.5">
                ${t.status === "New" ? `
                  <button onclick="claimTicket('${t.id}')" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold px-3 py-1.5 rounded-lg transition">
                    🔧 Claim Task
                  </button>
                ` : ""}

                ${t.status === "In progress" ? `
                  <button onclick="updateTicketField('${t.id}', 'status', 'Waiting')" class="bg-purple-100 hover:bg-purple-200 text-purple-800 font-semibold px-2.5 py-1.5 rounded-lg transition">
                    ⏸️ Waiting
                  </button>
                ` : ""}

                ${t.status !== "Resolved" ? `
                  <button onclick="resolveTicket('${t.id}')" class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold px-3 py-1.5 rounded-lg transition">
                    ✅ Resolve
                  </button>
                ` : ""}

                <button onclick="notifyRequesterWA('${t.id}')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-2.5 py-1.5 rounded-lg border transition">
                  📲 WA Update
                </button>

                ${currentUser.role === "qm" ? `
                  <button onclick="deleteTicket('${t.id}')" class="text-gray-400 hover:text-red-600 px-2 py-1.5" title="Delete Ticket">
                    🗑️
                  </button>
                ` : ""}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function updateTicketField(ticketId, field, value) {
      await dbFetch(`/tickets/${ticketId}/${field}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(value)
      });
      fetchUsersAndTickets();
    }

    async function assignStaff(ticketId, staffName) {
      const newStatus = staffName === "UNASSIGNED" ? "New" : "In progress";
      await Promise.all([
        dbFetch(`/tickets/${ticketId}/assignedTo.json`, {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(staffName)
        }),
        dbFetch(`/tickets/${ticketId}/status.json`, {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(newStatus)
        })
      ]);
      fetchUsersAndTickets();
    }

    async function claimTicket(ticketId) {
      await assignStaff(ticketId, currentUser.name);
    }

    async function resolveTicket(ticketId) {
      const ticket = allTickets.find(t => t.id === ticketId);
      const handler = (ticket && ticket.assignedTo !== "UNASSIGNED") ? ticket.assignedTo : currentUser.name;
      const resolvedTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      await Promise.all([
        dbFetch(`/tickets/${ticketId}/status.json`, {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify("Resolved")
        }),
        dbFetch(`/tickets/${ticketId}/assignedTo.json`, {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(handler)
        }),
        dbFetch(`/tickets/${ticketId}/resolvedAt.json`, {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(resolvedTime)
        })
      ]);
      fetchUsersAndTickets();
    }

    function notifyRequesterWA(ticketId) {
      const t = allTickets.find(x => x.id === ticketId);
      if (!t) return;
      const msg = 
`Hello ${t.name}, update for your Service Desk ticket *#${t.id}* (${t.type}):
📌 *Current Status:* ${t.status}
🔧 *Handled by:* ${t.assignedTo}
📝 *Details:* ${t.details}`;
      window.open(`https://wa.me/${t.phone}?text=${encodeURIComponent(msg)}`, "_blank");
    }

    async function deleteTicket(ticketId) {
      if (!confirm(`Delete ticket #${ticketId}?`)) return;
      await dbFetch(`/tickets/${ticketId}.json`, { method: "DELETE" });
      fetchUsersAndTickets();
    }

    function setStatusFilter(status) {
      onlyUrgent = false;
      activeStatusFilter = status;
      document.querySelectorAll(".status-pill").forEach(btn => {
        const isActive = btn.getAttribute("data-status") === status;
        btn.className = isActive
          ? "status-pill px-3 py-1.5 rounded-full border bg-emerald-800 text-white"
          : "status-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50";
      });
      renderTickets();
    }

    function setUrgentFilter() {
      onlyUrgent = true;
      document.querySelectorAll(".status-pill").forEach(btn => {
        btn.className = "status-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50";
      });
      renderTickets();
    }

    function setTypeFilter(type) {
      activeTypeFilter = type;
      document.querySelectorAll(".type-pill").forEach(btn => {
        const isActive = btn.getAttribute("data-type") === type;
        btn.className = isActive
          ? "type-pill px-3 py-1.5 rounded-full border bg-gray-800 text-white"
          : "type-pill px-3 py-1.5 rounded-full border bg-white text-gray-600 hover:bg-gray-50";
      });
      renderTickets();
    }

    function setTimeFilter(range) {
      activeTimeFilter = range;
      document.querySelectorAll(".time-pill").forEach(btn => {
        btn.className = "time-pill px-3 py-1 rounded-full text-gray-600 hover:bg-gray-100";
      });
      document.getElementById("time-" + range).className = "time-pill px-3 py-1 rounded-full bg-emerald-800 text-white";
      updateMetrics();
      renderTickets();
    }

    function exportCSV() {
      if (allTickets.length === 0) return alert("No tickets to export.");
      const headers = ["Ticket ID", "Requester", "WhatsApp", "Type", "Sub-Category", "Urgency", "Status", "Assigned Staff", "Created At", "Resolved At", "Details"];
      const rows = allTickets.map(t => [
        t.id, `"${t.name}"`, t.phone, `"${t.type}"`, `"${t.subCategory || ''}"`, t.urgency, t.status, `"${t.assignedTo}"`, `"${t.createdAt}"`, `"${t.resolvedAt || ''}"`, `"${(t.details || '').replace(/"/g, '""')}"`
      ]);
      const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csvContent));
      link.setAttribute("download", `OnsiteDesk_Report_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
    }

    function signOut() {
      localStorage.removeItem("currentUser");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
